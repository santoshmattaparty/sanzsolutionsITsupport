services:
  mysql:
    image: mysql:8.4
    container_name: sanzsolutions-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sanzsolutionsdb
      MYSQL_USER: sanzuser
      MYSQL_PASSWORD: sanzpass123
      MYSQL_ROOT_PASSWORD: rootpass123
    ports:
      - "3306:3306"
    volumes:
      - sanzsolutions_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: .
    container_name: sanzsolutions-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/sanzsolutionsdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: sanzuser
      DB_PASSWORD: sanzpass123
    ports:
      - "8080:8080"
volumes:
  sanzsolutions_mysql_data:
